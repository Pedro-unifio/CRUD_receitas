<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caderno de receitas</title><link rel="stylesheet" href="/style.css"></head><body><main><header><small>CRUD • SEQUELIZE • SQLITE</small><h1>Caderno de receitas</h1><p>Cada receita possui nome único; tempo de preparo e número de porções devem ser positivos.</p></header><section><h2 id="form-title">Nova receita</h2><form id="form"><label for="nome">Nome</label><input id="nome" name="nome" type="text" required >
<label for="categoria">Categoria</label><input id="categoria" name="categoria" type="text" required >
<label for="tempoMinutos">Tempo de preparo (minutos)</label><input id="tempoMinutos" name="tempoMinutos" type="number" required min="1">
<label for="porcoes">Número de porções</label><input id="porcoes" name="porcoes" type="number" required min="1"><div class="actions"><button id="save">Salvar</button><button id="cancel" type="button" hidden>Cancelar edição</button></div></form></section><section><h2>Receitas</h2><p role="status" id="message"></p><ul id="list"></ul></section></main><script src="/app.js" defer></script></body></html>
